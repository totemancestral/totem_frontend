# Frontend autonome : le backend est un dépôt indépendant.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - core-js
  - esbuild
  - sharp
  - unrs-resolver
  - '@prisma/client'
  - '@prisma/engines'
  - 'prisma'
